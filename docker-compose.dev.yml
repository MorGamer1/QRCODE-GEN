# Local development infra only - NOT used in production (see docker-compose.yml for that).
# Runs just Postgres/Redis/MinIO in containers so you don't need any of them installed
# natively; the api/web apps themselves still run on the host via `pnpm dev` for fast
# hot-reload, rather than being containerized here.
#
#   docker compose -f docker-compose.dev.yml up -d
#   cp apps/api/.env.example apps/api/.env   # already matches the credentials below
#   pnpm install && pnpm db:migrate && pnpm dev
#
# Credentials here are dev-only placeholders, published on localhost only - never reuse them
# in a real deployment.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qrgen_dev_password
      POSTGRES_DB: qrgen
    ports:
      - '5432:5432'
    volumes:
      - ./infra/data/dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d qrgen']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./infra/data/dev-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devkey
      MINIO_ROOT_PASSWORD: devsecret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./infra/data/dev-minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-12-18T13-15-44Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 devkey devsecret &&
      mc mb --ignore-existing local/qrgen-dev &&
      mc anonymous set download local/qrgen-dev
      "
