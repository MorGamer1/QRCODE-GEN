user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent"';
  access_log  /var/log/nginx/access.log  main;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout  65;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml
             application/xml application/xml+rss text/javascript image/svg+xml;

  server_tokens off;

  # nginx is the internet-facing edge in this deployment (docker-compose.yml publishes only
  # this service's ports) - $remote_addr is already the real client IP here, so there is
  # nothing upstream to recover it from via the real_ip module. proxy-common.conf instead
  # sets X-Forwarded-For/X-Real-IP *outbound* to the api/web containers, one hop, which is
  # what apps/api/src/main.ts's `trust proxy: 1` expects.

  # Upload cap: must stay above the app's own multer limit (see files.controller.ts,
  # currently 25MB) or nginx would reject large logo/asset uploads before the app even sees
  # them and returns its own friendlier validation error.
  client_max_body_size 30m;

  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=redirect:10m rate=60r/s;
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
