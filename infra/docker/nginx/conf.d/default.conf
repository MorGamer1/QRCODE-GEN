upstream api_upstream {
  server api:4000;
  keepalive 32;
}

upstream web_upstream {
  server web:3000;
  keepalive 32;
}

upstream minio_upstream {
  server minio:9000;
  keepalive 8;
}

server {
  listen 80 default_server;
  server_name _;

  # Defense-in-depth on top of Helmet's own headers (see apps/api/src/main.ts) - these apply
  # to every response nginx serves, including the Next.js app.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Once TLS certs are mounted (see docs/DEPLOYMENT.md), add a `listen 443 ssl;` server block
  # with ssl_certificate/ssl_certificate_key and uncomment this redirect:
  # return 301 https://$host$request_uri;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Short redirect URLs printed on QR codes, e.g. https://qr.example.com/r/AbC123 - rewritten
  # to the API's actual /api/r/:code route (global prefix + VERSION_NEUTRAL, see
  # apps/api/src/modules/redirect/redirect.controller.ts and main.ts).
  location /r/ {
    limit_req zone=redirect burst=40 nodelay;
    rewrite ^/r/(.*)$ /api/r/$1 break;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy-common.conf;
  }

  # REST API + Swagger docs (/api/docs) - passed straight through, the backend's own global
  # prefix is already "api".
  location /api/ {
    limit_req zone=general burst=40 nodelay;
    proxy_pass http://api_upstream;
    include /etc/nginx/proxy-common.conf;
  }

  # Publicly-viewable uploaded assets (QR logos, "Image" content-type files) - see the
  # minio-init comment in docker-compose.yml for why these are anonymous-read rather than
  # signed URLs. S3_PUBLIC_URL defaults to "$PUBLIC_BASE_URL/files/$S3_BUCKET", so the bucket
  # name is already part of the path this rewrite strips down to.
  location /files/ {
    limit_req zone=general burst=40 nodelay;
    rewrite ^/files/(.*)$ /$1 break;
    proxy_pass http://minio_upstream;
    include /etc/nginx/proxy-common.conf;
  }

  # Next.js app: pages, dashboard, static assets. Everything not matched above.
  location / {
    limit_req zone=general burst=40 nodelay;
    proxy_pass http://web_upstream;
    include /etc/nginx/proxy-common.conf;
  }
}
