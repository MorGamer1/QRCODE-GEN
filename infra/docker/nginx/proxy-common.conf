# Shared by every location block in conf.d/default.conf. proxy_set_header Connection ""
# (paired with proxy_http_version 1.1) lets nginx reuse keepalive connections to the
# api/web upstream pools instead of opening a fresh TCP connection per request - safe here
# because neither app serves WebSocket traffic, so there's no Upgrade handshake to preserve.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
